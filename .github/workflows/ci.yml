name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm lint

      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - run: pnpm --filter playground typecheck

      - run: pnpm typecheck:e2e

      - run: pnpm test

      - run: pnpm build:playground

      - run: pnpm docs:build

      - name: Verify publish artifacts
        run: |
          test -f packages/core/dist/index.js
          test -f packages/core/dist/index.d.ts
          test -f packages/vue/dist/index.js
          test -f packages/vue/dist/style.css
          test -f packages/vue/dist/index.d.ts
          test -f packages/vite/dist/index.js
          test -f packages/vite/dist/index.d.ts
          test -f packages/weather/dist/index.js
          test -f packages/weather/dist/index.d.ts
          test -f packages/flood/dist/index.js
          test -f packages/flood/dist/index.d.ts
          test -f packages/earth/dist/index.js
          test -f packages/earth/dist/index.d.ts
          test -f packages/wind/dist/index.js
          test -f packages/wind/dist/index.d.ts

      - name: Verify tarball install in clean project
        run: pnpm verify:pack

      - name: Pack tarballs
        run: |
          mkdir -p /tmp/packs
          pnpm --filter "./packages/*" exec npm pack --pack-destination /tmp/packs
          ls -al /tmp/packs

  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true # 观察一周稳定后改为阻塞
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
